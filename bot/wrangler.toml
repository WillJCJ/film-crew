#:schema node_modules/wrangler/config-schema.json
name = "film-crew-bot"
main = "bot-worker.js"
compatibility_date = "2026-05-06"

# Secrets — set via wrangler, never commit:
#   wrangler secret put BOT_TOKEN    ← from @BotFather
#   wrangler secret put BOT_SECRET   ← any random string, same value on the main worker
#   wrangler secret put API_BASE     ← e.g. https://film-crew.your-subdomain.workers.dev

[observability.logs]
enabled = true
invocation_logs = true
