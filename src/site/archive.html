<template id="archive-row-tpl">
  <li class="archive-row">
    <details>
      <summary class="archive-row-summary">
        <span class="archive-row-title">
          <span data-bind="title"></span>
          <span class="muted archive-row-year" data-bind="year"></span>
        </span>
        <span class="archive-row-chooser muted" data-bind="chooser"></span>
        <span class="archive-row-date muted" data-bind="date"></span>
        <strong class="archive-row-score" data-bind="score"></strong>
      </summary>
      <div class="archive-row-body">
        <img class="archive-row-poster" data-bind="poster" alt="" hidden>
        <div class="archive-row-body-text">
          <p data-bind="plot"></p>
          <a class="button primary" data-bind="detailLink">Full details</a>
        </div>
      </div>
    </details>
  </li>
</template>

<section class="panel">
  <div class="section-heading">
    <div>
      <p class="eyebrow">Archive</p>
      <h1>Upcoming screenings</h1>
    </div>
  </div>
  <ul id="upcoming-list" class="archive-list">
    <li><p class="muted">Loading…</p></li>
  </ul>
</section>

<section class="panel">
  <div class="section-heading">
    <div>
      <p class="eyebrow">Archive</p>
      <h1>Previous screenings</h1>
    </div>
  </div>
  <ul id="archive-list" class="archive-list">
    <li><p class="muted">Loading…</p></li>
  </ul>
</section>
